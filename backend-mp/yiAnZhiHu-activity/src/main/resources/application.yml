server:
  port: 8086
spring:
  profiles:
    active: dev
  datasource:
    url: #改成自己信息
    driver-class-name: com.mysql.cj.jdbc.Driver
    username:  #改成自己信息
    password:  #改成自己信息
    hikari:
      # 连接池核心配置（解决 "Too many connections" 关键参数）
      maximum-pool-size: 5          # 最大连接数（建议≤数据库max_connections的80%，假设数据库max_connections=150，则设为120）
      minimum-idle: 2                # 最小空闲连接数（根据基础并发量调整）
      connection-timeout: 30000        # 连接超时时间（30秒，避免长时间等待无效连接）
      connection-test-query: SELECT 1  # 测试连接有效性的SQL（必填，避免获取无效连接）
      idle-timeout: 600000            # 空闲连接存活时间（10分钟，及时释放空闲连接）
      max-lifetime: 1800000           # 连接最大存活时间（30分钟，防止连接老化）
  application:
    name: activity-service
  cloud:
    nacos:
      server-addr: #改成自己信息
  redis:
    host: #改成自己信息
    port: #改成自己信息
    password: #改成自己信息
  rabbitmq:
    host: #改成自己信息
    port: #改成自己信息
    virtual-host: /yian
    username: #改成自己信息
    password: #改成自己信息
    #开启连接失败重试
    connection-timeout: 1s
    template:
      retry:
        enabled: true
knife4j:  #api文档配置
  enable: true
  openapi:
    title: 接口文档
    description: "活动接口文档"
    email: 1653540462@qq.com
    concat: #改成自己信息
    url:
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.yiAnZhiHu.activity.controller
feign:
  okhttp:
    enabled: true # 开启OKHttp功能
zhihu:
  alioss:
    access-key-id: #改成自己信息
    endpoint: #改成自己信息
    access-key-secret: #改成自己信息
    bucket-name: #改成自己信息
