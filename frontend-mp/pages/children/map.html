<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当前位置地图</title>
    <style>
        #container {
            width: 100%;
            height: 500px;
            margin-top: 20px;
        }

        .info-container {
            margin: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="info-container">
        <p>当前位置：<span id="locationInfo">正在获取位置信息...</span></p>
    </div>
    <div id="container"></div>

    <script type="text/javascript">
        window._AMapSecurityConfig = {
            securityJsCode: 'YOUR_SECURITY_CODE',
        }
    </script>
    <script type="text/javascript"
        src="https://webapi.amap.com/maps?v=2.0&key=1db93ddf57523eb18a461389935cee31"></script>
    <script>
        let map = null;
        let geocoder = null;

        // 初始化地图
        function initMap(lng, lat) {
            map = new AMap.Map('container', {
                zoom: 15,
                center: [lng, lat]
            });

            // 添加标记
            new AMap.Marker({
                map: map,
                position: [lng, lat],
                title: '当前位置'
            });

            // 添加定位控件
            map.plugin('AMap.Geolocation', function () {
                var geolocation = new AMap.Geolocation({
                    enableHighAccuracy: true,
                    timeout: 10000,
                    buttonPosition: 'RB',
                    buttonOffset: new AMap.Pixel(10, 20),
                    zoomToAccuracy: true
                });
                map.addControl(geolocation);
            });
        }

        // 获取当前位置
        function getCurrentPosition() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function (position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        // 更新位置信息显示
                        document.getElementById('locationInfo').textContent =
                            `纬度: ${lat.toFixed(6)}, 经度: ${lng.toFixed(6)}`;

                        // 初始化地图
                        initMap(lng, lat);
                    },
                    function (error) {
                        let errorMessage = "获取位置信息失败: ";
                        switch (error.code) {
                            case error.PERMISSION_DENIED:
                                errorMessage += "用户拒绝了位置请求";
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMessage += "位置信息不可用";
                                break;
                            case error.TIMEOUT:
                                errorMessage += "获取位置超时";
                                break;
                            default:
                                errorMessage += "未知错误";
                        }
                        document.getElementById('locationInfo').textContent = errorMessage;
                    }
                );
            } else {
                document.getElementById('locationInfo').textContent =
                    "您的浏览器不支持地理定位功能";
            }
        }

        // 页面加载完成后获取位置
        window.onload = function () {
            getCurrentPosition();
        };
    </script>
</body>

</html>
